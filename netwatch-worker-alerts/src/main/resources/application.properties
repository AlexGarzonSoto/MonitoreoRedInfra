spring.application.name=netwatch-worker-alerts
server.port=8083

# ─── RabbitMQ ───────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:netwatch}
spring.rabbitmq.password=${RABBITMQ_PASS}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:netwatch}
spring.rabbitmq.connection-timeout=30000
spring.rabbitmq.listener.simple.recovery-interval=5000
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# ─── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:netwatch}
spring.datasource.username=${DB_USER:netwatch}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─── SMTP (email) ────────────────────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Notificaciones ──────────────────────────────────────────────────────────
netwatch.alerts.min-severity=${ALERT_MIN_SEVERITY:HIGH}
netwatch.alerts.email-enabled=${ALERT_EMAIL_ENABLED:false}
netwatch.alerts.email-to=${ALERT_EMAIL_TO:}
netwatch.alerts.email-from=${ALERT_EMAIL_FROM:netwatch@localhost}
netwatch.alerts.webhook-enabled=${ALERT_WEBHOOK_ENABLED:false}
netwatch.alerts.webhook-url=${ALERT_WEBHOOK_URL:}

# ─── Actuator / Observabilidad ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.metrics.tags.application=${spring.application.name}
# El SMTP es opcional — no afectar el health si no está configurado
management.health.mail.enabled=false

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.com.netwatch=INFO
