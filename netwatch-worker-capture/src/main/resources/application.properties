spring.application.name=netwatch-worker-capture
server.port=8082

# ─── RabbitMQ ───────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:netwatch}
spring.rabbitmq.password=${RABBITMQ_PASS}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:netwatch}
spring.rabbitmq.connection-timeout=30000
spring.rabbitmq.listener.simple.recovery-interval=5000
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# ─── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:netwatch}
spring.datasource.username=${DB_USER:netwatch}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ─── Actuator / Observabilidad ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.metrics.tags.application=${spring.application.name}

# ─── Pcap4J – Captura de paquetes ──────────────────────────────────────────
# Interfaz de red a escuchar. "any" captura en todas las interfaces (Linux).
netwatch.capture.network-interface=${CAPTURE_INTERFACE:eth0}
# Máximo de bytes capturados por paquete (snaplen).
netwatch.capture.snap-len=65535
# Timeout del read en milisegundos (pcap read timeout).
netwatch.capture.timeout-ms=10
# Modo promiscuo: captura todo el tráfico, no solo el dirigido al host.
netwatch.capture.promiscuous=true
# Permite deshabilitar la captura (útil en entornos de test/CI sin NET_RAW).
netwatch.capture.enabled=${CAPTURE_ENABLED:true}

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.com.netwatch=INFO
logging.level.org.pcap4j=WARN
