spring.application.name=netwatch-api-gateway
server.port=8080

# ─── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:netwatch}
spring.datasource.username=${DB_USER:netwatch}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP connection pool ────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─── RabbitMQ ───────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:netwatch}
spring.rabbitmq.password=${RABBITMQ_PASS}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:netwatch}
spring.rabbitmq.connection-timeout=30000
spring.rabbitmq.listener.simple.recovery-interval=5000
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# ─── JWT ────────────────────────────────────────────────────────────────────
# En producción estas claves deben tener al menos 32 caracteres
netwatch.jwt.secret=${JWT_SECRET}
netwatch.jwt.refresh-secret=${JWT_REFRESH_SECRET}
netwatch.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:1800000}
netwatch.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ─── Actuator / Observabilidad ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.metrics.tags.application=${spring.application.name}

# ─── Worker Capture (proxy para gestión de interfaz) ────────────────────────
netwatch.capture.worker.url=${WORKER_CAPTURE_URL:http://worker-capture:8082}

# ─── NVD API (opcional — para consultar CVEs en tiempo real) ────────────────
netwatch.nvd.api.key=${NVD_API_KEY:}

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.com.netwatch=INFO
logging.level.org.springframework.security=WARN
