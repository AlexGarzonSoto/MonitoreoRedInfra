name: Deploy — Docker Hub

on:
  push:
    tags: ['v*.*.*']

jobs:

  # ── Publicar microservicios Java (matriz en paralelo) ─────────────────────
  publish:
    name: Publicar ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - netwatch-api-gateway
          - netwatch-worker-capture
          - netwatch-worker-analysis
          - netwatch-worker-alerts
          - netwatch-worker-osint
          - netwatch-worker-scanner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar JAR (${{ matrix.service }})
        run: mvn package -DskipTests -B -pl ${{ matrix.service }} -am -q

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadatos de imagen (tags semánticos)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build y push imagen
        # El contexto es la raíz del proyecto — el Dockerfile específico se
        # indica con -f. Los Dockerfiles multi-módulo necesitan acceso al pom.xml padre.
        uses: docker/build-push-action@v5
        with:
          context:    .
          file:       ${{ matrix.service }}/Dockerfile
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}

  # ── Publicar el frontend (Vue.js → Nginx) ────────────────────────────────
  publish-frontend:
    name: Publicar frontend (Vue.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadatos frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/netwatch-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build y push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}

  # ── Actualizar overview (README) en cada repositorio de Docker Hub ────────
  update-dockerhub-overview:
    name: Overview Docker Hub — ${{ matrix.repo }}
    runs-on: ubuntu-latest
    needs: [publish, publish-frontend]
    strategy:
      fail-fast: false
      matrix:
        repo:
          - netwatch-api-gateway
          - netwatch-worker-capture
          - netwatch-worker-analysis
          - netwatch-worker-alerts
          - netwatch-worker-osint
          - netwatch-worker-scanner
          - netwatch-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Actualizar README en Docker Hub
        uses: peter-evans/dockerhub-description@v3
        with:
          username:        ${{ secrets.DOCKERHUB_USERNAME }}
          password:        ${{ secrets.DOCKERHUB_TOKEN }}
          repository:      ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.repo }}
          readme-filepath: README.md
