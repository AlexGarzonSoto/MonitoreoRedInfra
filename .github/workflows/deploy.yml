name: Deploy — Docker Hub

on:
  push:
    tags: ['v*.*.*']

jobs:

  publish:
    name: Publicar ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - netwatch-api-gateway
          - netwatch-worker-capture
          - netwatch-worker-analysis
          - netwatch-worker-alerts
          - netwatch-worker-osint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar JAR
        run: mvn package -DskipTests -B -pl ${{ matrix.service }} -am -q

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadatos de imagen (tags semánticos)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build y push imagen
        uses: docker/build-push-action@v5
        with:
          context:    .
          file:       ${{ matrix.service }}/Dockerfile
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}

  publish-frontend:
    name: Publicar frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadatos frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/netwatch-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build y push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
