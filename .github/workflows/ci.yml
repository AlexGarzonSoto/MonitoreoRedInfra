name: CI — NetWatch Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── 1. Escaneo de secretos en el código ───────────────────────────────────
  secrets-scan:
    name: Gitleaks — Secretos en código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo para Gitleaks

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. SAST — Análisis estático de seguridad ──────────────────────────────
  sast:
    name: SAST (SpotBugs + Semgrep)
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: SpotBugs + Find Security Bugs
        run: mvn spotbugs:spotbugs -B
        continue-on-error: true

      - name: Semgrep OSS (sin token — reglas públicas gratuitas)
        run: |
          pip install semgrep --quiet
          semgrep \
            --config p/java \
            --config p/owasp-top-ten \
            --config p/spring-boot \
            --json \
            --output semgrep-report.json \
            --error . || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            **/target/spotbugsXml.xml
            semgrep-report.json

  # ── 3. SCA — Análisis de dependencias ────────────────────────────────────
  sca:
    name: SCA — OWASP Dependency-Check
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: OWASP Dependency-Check
        run: mvn dependency-check:check -B
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.*'

  # ── 4. Build + Trivy (escaneo de imágenes) ───────────────────────────────
  build-and-scan:
    name: Build + Trivy (${{ matrix.service }})
    needs: [sast, sca]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - netwatch-api-gateway
          - netwatch-worker-capture
          - netwatch-worker-analysis
          - netwatch-worker-alerts
          - netwatch-worker-osint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar JAR (${{ matrix.service }})
        run: mvn package -DskipTests -B -pl ${{ matrix.service }} -am -q

      - name: Construir imagen Docker
        run: |
          docker build \
            -f ${{ matrix.service }}/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }} \
            .

      - name: Trivy — escaneo de imagen
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy-${{ matrix.service }}.sarif

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

  # ── 5. Tests unitarios + cobertura JaCoCo ────────────────────────────────
  unit-tests:
    name: Tests unitarios + JaCoCo
    needs: build-and-scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB:       netwatch_test
          POSTGRES_USER:     netwatch
          POSTGRES_PASSWORD: testpass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U netwatch"
          --health-interval 10s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.12-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Tests con cobertura JaCoCo (≥ 70%)
        run: |
          mvn verify -B \
            -pl netwatch-api-gateway,netwatch-worker-analysis \
            -am
        env:
          DB_HOST:             localhost
          DB_PORT:             5432
          DB_NAME:             netwatch_test
          DB_USER:             netwatch
          DB_PASS:             testpass
          RABBITMQ_HOST:       localhost
          RABBITMQ_USER:       guest
          RABBITMQ_PASS:       guest
          JWT_SECRET:          test-secret-key-must-be-at-least-32-chars-long-for-hmac
          JWT_REFRESH_SECRET:  test-refresh-key-must-be-at-least-32-chars-long-for-hmac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'

  # ── 6. DAST — OWASP ZAP Baseline ─────────────────────────────────────────
  dast:
    name: DAST — OWASP ZAP Baseline
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env para staging
        run: |
          cp .env.example .env
          sed -i 's/REEMPLAZA_CON_CADENA_ALEATORIA_64_CHARS_openssl_rand_hex_64/test-jwt-secret-64-chars-minimum-for-hmac-sha256-algorithm/' .env
          sed -i 's/REEMPLAZA_CON_OTRA_CADENA_64_CHARS_openssl_rand_hex_64/test-refresh-secret-64-chars-minimum-for-hmac-sha256-ok/' .env
          sed -i 's/REEMPLAZA_CON_PASSWORD_SEGURO/testpassword123/g' .env

      - name: Levantar entorno de staging
        run: |
          docker compose up -d postgres rabbitmq valkey api-gateway
          timeout 120 bash -c \
            'until curl -sf http://localhost:8080/actuator/health; do sleep 5; done'

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target:          'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          fail_action:     warn
          cmd_options:     '-I'

      - name: Bajar staging
        if: always()
        run: docker compose down -v

  # ── 7. IaC Scan — Checkov ─────────────────────────────────────────────────
  iac-scan:
    name: IaC Scan — Checkov
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov — Dockerfiles
        uses: bridgecrewio/checkov-action@master
        with:
          directory: '.'
          framework: dockerfile
          soft_fail:  true

      - name: Checkov — docker-compose.yml
        uses: bridgecrewio/checkov-action@master
        with:
          file:      docker-compose.yml
          framework: docker_compose
          soft_fail:  true
