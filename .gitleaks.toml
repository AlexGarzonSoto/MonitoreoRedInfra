title = "NetWatch — Gitleaks Configuration"

# Allowlist global: patrones que son falsos positivos conocidos
[allowlist]
  description = "Falsos positivos en documentación y configuración"

  # URLs internas de Docker Compose: http://service-name:PORT/path
  # Gitleaks interpreta "service-name:8080" como "usuario:contraseña"
  # pero en este proyecto son nombres de servicio Docker + número de puerto.
  regexes = [
    '''http://[a-z][a-z0-9-]+:\d+/''',
  ]

  # Archivos de documentación — los ejemplos de código no son secretos reales
  paths = [
    '''docs/.*\.md''',
    '''README\.md''',
  ]
