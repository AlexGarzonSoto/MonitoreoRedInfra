spring.application.name=netwatch-worker-scanner
server.port=8085

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# Configuración del escáner
netwatch.scanner.nmap-timeout-seconds=120
netwatch.scanner.nvd-api-url=https://services.nvd.nist.gov/rest/json/cves/2.0
netwatch.scanner.nvd-results-per-query=5
netwatch.scanner.dry-run=${SCANNER_DRY_RUN:false}

logging.level.com.netwatch=INFO
