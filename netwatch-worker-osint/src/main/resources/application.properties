spring.application.name=netwatch-worker-osint
server.port=8084

# ─── RabbitMQ ───────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:netwatch}
spring.rabbitmq.password=${RABBITMQ_PASS}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:netwatch}

# ─── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:netwatch}
spring.datasource.username=${DB_USER:netwatch}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─── Valkey / Redis ─────────────────────────────────────────────────────────
# Valkey es 100% compatible con el protocolo Redis — no requiere ningún
# cambio en el cliente Spring Data Redis.
spring.data.redis.host=${VALKEY_HOST:localhost}
spring.data.redis.port=${VALKEY_PORT:6379}
spring.data.redis.password=${VALKEY_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# ─── ip-api.com: rate limit de 45 req/min en plan gratuito ─────────────────
# Se usa RestClient (Spring Boot 3.2+), sin API key ni registro previo.

# ─── Actuator / Observabilidad ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.metrics.tags.application=${spring.application.name}

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.com.netwatch=INFO
