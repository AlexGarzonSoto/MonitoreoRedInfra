---
- name: Instalar dependencias del sistema
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - git
      - make
    state: present

- name: Agregar clave GPG de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Agregar repositorio de Docker
  ansible.builtin.apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present

- name: Instalar Docker Engine y Docker Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Iniciar y habilitar Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Crear directorio de despliegue
  ansible.builtin.file:
    path: /opt/netwatch
    state: directory
    mode: "0755"
    owner: root
    group: docker

- name: Copiar docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: /opt/netwatch/docker-compose.yml
    mode: "0644"

- name: Copiar archivos de infraestructura SQL
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../infrastructure/sql/"
    dest: /opt/netwatch/infrastructure/sql/
    mode: "0644"

- name: Copiar configuración de monitoreo
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/"
    dest: /opt/netwatch/monitoring/
    mode: "0644"

- name: Copiar Makefile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../Makefile"
    dest: /opt/netwatch/Makefile
    mode: "0644"

- name: Crear archivo .env desde plantilla
  ansible.builtin.template:
    src: env.j2
    dest: /opt/netwatch/.env
    mode: "0600"
    owner: root
    group: root

- name: Iniciar NetWatch con docker compose
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/netwatch
  register: compose_result
  changed_when: "'Started' in compose_result.stdout or 'Created' in compose_result.stdout"

- name: Esperar a que PostgreSQL esté listo
  ansible.builtin.wait_for:
    host: localhost
    port: 5432
    delay: 10
    timeout: 120

- name: Esperar a que el API Gateway esté listo
  ansible.builtin.uri:
    url: http://localhost:8080/actuator/health
    status_code: 200
  register: health_check
  retries: 12
  delay: 15
  until: health_check.status == 200
