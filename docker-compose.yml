version: "3.9"

# ── Redes ───────────────────────────────────────────────────────────────────
networks:
  netwatch-net:
    driver: bridge

# ── Volúmenes persistentes ──────────────────────────────────────────────────
volumes:
  postgres_data:
  rabbitmq_data:
  valkey_data:
  grafana_data:
  loki_data:

# ── Servicios ───────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL + TimescaleDB ──────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: netwatch-postgres
    networks: [netwatch-net]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-netwatch}
      POSTGRES_USER:     ${POSTGRES_USER:-netwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── RabbitMQ ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: netwatch-rabbitmq
    networks: [netwatch-net]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-netwatch}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # UI de administración
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Valkey (reemplaza Redis, protocolo 100% compatible) ───────────────────
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: netwatch-valkey
    networks: [netwatch-net]
    command: valkey-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: netwatch-api-gateway/Dockerfile
    image: ${DOCKERHUB_USERNAME:-netwatch}/netwatch-api-gateway:latest
    container_name: netwatch-api-gateway
    networks: [netwatch-net]
    ports:
      - "8080:8080"
    environment:
      DB_HOST:              postgres
      DB_PORT:              5432
      DB_NAME:              ${POSTGRES_DB:-netwatch}
      DB_USER:              ${POSTGRES_USER:-netwatch}
      DB_PASS:              ${POSTGRES_PASSWORD}
      RABBITMQ_HOST:        rabbitmq
      RABBITMQ_USER:        ${RABBITMQ_USER:-netwatch}
      RABBITMQ_PASS:        ${RABBITMQ_PASSWORD}
      JWT_SECRET:           ${JWT_SECRET}
      JWT_REFRESH_SECRET:   ${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ── Worker Captura ─────────────────────────────────────────────────────────
  worker-capture:
    build:
      context: .
      dockerfile: netwatch-worker-capture/Dockerfile
    image: ${DOCKERHUB_USERNAME:-netwatch}/netwatch-worker-capture:latest
    container_name: netwatch-worker-capture
    # network_mode host: necesario para capturar tráfico de la interfaz física
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      RABBITMQ_HOST:          localhost   # host porque usa network_mode: host
      RABBITMQ_USER:          ${RABBITMQ_USER:-netwatch}
      RABBITMQ_PASS:          ${RABBITMQ_PASSWORD}
      DB_HOST:                localhost
      DB_USER:                ${POSTGRES_USER:-netwatch}
      DB_PASS:                ${POSTGRES_PASSWORD}
      CAPTURE_INTERFACE:      ${CAPTURE_INTERFACE:-eth0}
      CAPTURE_ENABLED:        ${CAPTURE_ENABLED:-true}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── Worker Análisis ────────────────────────────────────────────────────────
  worker-analysis:
    build:
      context: .
      dockerfile: netwatch-worker-analysis/Dockerfile
    image: ${DOCKERHUB_USERNAME:-netwatch}/netwatch-worker-analysis:latest
    container_name: netwatch-worker-analysis
    networks: [netwatch-net]
    ports:
      - "8081:8081"
    environment:
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_NAME:       ${POSTGRES_DB:-netwatch}
      DB_USER:       ${POSTGRES_USER:-netwatch}
      DB_PASS:       ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-netwatch}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ── Worker Alertas ─────────────────────────────────────────────────────────
  worker-alerts:
    build:
      context: .
      dockerfile: netwatch-worker-alerts/Dockerfile
    image: ${DOCKERHUB_USERNAME:-netwatch}/netwatch-worker-alerts:latest
    container_name: netwatch-worker-alerts
    networks: [netwatch-net]
    ports:
      - "8083:8083"
    environment:
      DB_HOST:              postgres
      DB_PORT:              5432
      DB_NAME:              ${POSTGRES_DB:-netwatch}
      DB_USER:              ${POSTGRES_USER:-netwatch}
      DB_PASS:              ${POSTGRES_PASSWORD}
      RABBITMQ_HOST:        rabbitmq
      RABBITMQ_USER:        ${RABBITMQ_USER:-netwatch}
      RABBITMQ_PASS:        ${RABBITMQ_PASSWORD}
      SMTP_HOST:            ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT:            ${SMTP_PORT:-587}
      SMTP_USER:            ${SMTP_USER:-}
      SMTP_PASSWORD:        ${SMTP_PASSWORD:-}
      ALERT_MIN_SEVERITY:   ${ALERT_MIN_SEVERITY:-HIGH}
      ALERT_EMAIL_ENABLED:  ${ALERT_EMAIL_ENABLED:-false}
      ALERT_EMAIL_TO:       ${ALERT_EMAIL_TO:-}
      ALERT_WEBHOOK_ENABLED:${ALERT_WEBHOOK_ENABLED:-false}
      ALERT_WEBHOOK_URL:    ${ALERT_WEBHOOK_URL:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ── Worker OSINT ───────────────────────────────────────────────────────────
  worker-osint:
    build:
      context: .
      dockerfile: netwatch-worker-osint/Dockerfile
    image: ${DOCKERHUB_USERNAME:-netwatch}/netwatch-worker-osint:latest
    container_name: netwatch-worker-osint
    networks: [netwatch-net]
    ports:
      - "8084:8084"
    environment:
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_NAME:       ${POSTGRES_DB:-netwatch}
      DB_USER:       ${POSTGRES_USER:-netwatch}
      DB_PASS:       ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-netwatch}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
      VALKEY_HOST:   valkey
      VALKEY_PORT:   6379
      VALKEY_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-netwatch}/netwatch-frontend:latest
    container_name: netwatch-frontend
    networks: [netwatch-net]
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: netwatch-prometheus
    networks: [netwatch-net]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:latest
    container_name: netwatch-grafana
    networks: [netwatch-net]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "http://localhost:3001"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── Loki ───────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: netwatch-loki
    networks: [netwatch-net]
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # ── Promtail ──────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: netwatch-promtail
    networks: [netwatch-net]
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
